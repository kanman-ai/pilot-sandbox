<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Invoice</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <p><a href="/">Back to invoices</a></p>
      <h1 id="invoice-number">Invoice</h1>
      <dl>
        <dt>Customer</dt><dd id="invoice-customer"></dd>
        <dt>Issued</dt><dd id="invoice-issued"></dd>
        <dt>Due</dt><dd id="invoice-due"></dd>
        <dt>Status</dt><dd id="invoice-status"></dd>
        <dt id="invoice-paid-label" hidden>Paid on</dt><dd id="invoice-paid" hidden></dd>
        <dt id="invoice-subtotal-label" hidden>Subtotal</dt><dd id="invoice-subtotal" hidden></dd>
        <dt id="invoice-discount-label" hidden>Discount</dt><dd id="invoice-discount" hidden></dd>
        <dt>Total</dt><dd id="invoice-total"></dd>
        <dt id="invoice-late-fee-label" hidden>Late fee</dt><dd id="invoice-late-fee" hidden></dd>
        <dt id="invoice-total-due-label" hidden>Total due</dt><dd id="invoice-total-due" hidden></dd>
      </dl>
      <p><button type="button" id="mark-paid" hidden>Mark as paid</button></p>
      <table aria-label="Invoice lines">
        <thead>
          <tr>
            <th scope="col">Description</th>
            <th scope="col" class="amount">Quantity</th>
            <th scope="col" class="amount">Unit price</th>
          </tr>
        </thead>
        <tbody id="line-rows"></tbody>
      </table>
      <p id="error" role="alert" hidden></p>
    </main>
    <script type="module" src="/invoice.js"></script>
  </body>
</html>
